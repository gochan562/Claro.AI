<!doctype html>
<html><head><meta charset="utf-8"><title>PENDING</title></head>
<body>
<div id="result">PENDING</div>
<script src="/pyodide_local.js"></script>
<script>
(async () => {
  const out = { cell1: null, cell2: null, reused: null, pyodideScripts: 0, errors: [] };
  try {
    const countScripts = () => document.querySelectorAll('script[src*="pyodide.js"]').length;
    const r1 = await window.PyodideLocal.run('print(1 + 2)');
    out.cell1 = { ok: r1.ok, stdout: r1.stdout, stderr: r1.stderr, error: r1.error };
    const scriptsAfterFirst = countScripts();
    const loadedAfterFirst = window.PyodideLocal.isLoaded();
    const r2 = await window.PyodideLocal.run('print(10 + 20)');
    out.cell2 = { ok: r2.ok, stdout: r2.stdout, stderr: r2.stderr, error: r2.error };
    out.pyodideScripts = countScripts();
    // Reused (not reinitialized): runtime loaded after cell 1, still exactly
    // one loader script after cell 2, and cell 2 executed correctly.
    out.reused = loadedAfterFirst === true && out.pyodideScripts === scriptsAfterFirst && scriptsAfterFirst === 1;
  } catch (e) { out.errors.push(String((e && e.message) || e)); }
  document.getElementById('result').textContent = JSON.stringify(out);
  document.title = 'DONE';
})();
</script>
</body></html>
